/* =========================================================================
   Guia (só no portátil) e estados de demonstração
   ========================================================================= */
function estadoGravacao(fechadosN, segundosNoAtual) {
  startSession(MODELS[0]);
  const demo = demoSession();
  S.live.blocks = demo.blocks.slice(0, fechadosN + 1).map((b, i) => ({ ...b, endAt: i < fechadosN ? b.endAt : null }));
  S.live.startedAt = '07:40';
  S.clock = S.live.blocks[fechadosN].startAt + segundosNoAtual * 1000;
}
const ECRAS = [
  { n: 1, id: 'inicio', label: 'Início', go() { S.screen = 'inicio'; S.tab = 'inicio'; S.live = null; } },
  { n: 2, id: 'gravacao', label: 'Gravação (5×5)', go() { estadoGravacao(12, 72); S.screen = 'gravacao'; } },
  { n: 3, id: 'ficha', label: 'Ficha rápida (passadeira)', go() { estadoGravacao(12, 4); S.screen = 'gravacao'; openSheet(S.live, 11, 'live'); } },
  { n: 4, id: 'hiit', label: 'Gravação em HIIT', go() { startSession(MODELS[1]); S.live.startedAt = '18:05'; [82, 85, 88].forEach((s) => { S.clock += s * 1000; mark(false); }); S.clock += 41000; S.screen = 'gravacao'; } },
  { n: 5, id: 'pos', label: 'Pós-treino', go() { S.post = demoSession('pos'); S.post.terminouAs = '08:22'; S.post.notes = ''; S.abertas = new Set(['pos:2']); S.screen = 'pos'; S.live = null; } },
  { n: 6, id: 'resumo', label: 'Resumo por blocos', go() { S.view = S.sessions.find((x) => x.id === 'demo'); S.abertas = new Set(['demo:2']); S.screen = 'resumo'; S.tab = 'historico'; } },
  { n: 7, id: 'historico', label: 'Histórico', go() { S.screen = 'historico'; S.tab = 'historico'; S.confirmDelete = null; } },
  { n: 8, id: 'modelos', label: 'Modelos', go() { S.screen = 'modelos'; S.tab = 'modelos'; } },
  { n: 9, id: 'definicoes', label: 'Definições', go() { S.screen = 'definicoes'; } },
  { n: 10, id: 'ficha-forca', label: '· Ficha de força', go() { estadoGravacao(11, 6); S.screen = 'gravacao'; openSheet(S.live, 10, 'live'); } },
  { n: 11, id: 'modelo', label: '· Editar modelo', go() { S.editModel = JSON.parse(JSON.stringify(MODELS[0])); S.screen = 'modelo'; S.tab = 'modelos'; } },
];
const TOQUES = {
  inicio: [['Começar com um desporto', '1'], ['Começar com um modelo', '1'], ['Ir ao histórico ou modelos', '1'], ['Abrir definições', '1']],
  gravacao: [['Marca', '1'], ['Marca + ficha (últimos valores)', '2'], ['… e subir a carga 2,5 kg', '3'], ['Mudar de desporto', '2'], ['Parar', '1 premir']],
  ficha: [['Guardar como está', '1'], ['Alterar um valor um passo', '+1'], ['Trocar de exercício', '+1'], ['Passadeira: ritmo → distância', '+1'], ['Deixar para depois', '1']],
  hiit: [['Marca (fecha a volta)', '1'], ['Parar', '1 premir'], ['Ficha durante o treino', 'não há']],
  pos: [['Abrir/fechar uma série', '1'], ['Preencher um bloco', '2'], ['Ir ao próximo em falta', '1'], ['Concluir', '1']],
  resumo: [['Abrir uma série', '1'], ['Preencher um bloco', '2'], ['Voltar', '1']],
  historico: [['Abrir uma sessão', '1'], ['Apagar uma sessão', '2'], ['Desistir de apagar', '1']],
  modelos: [['Iniciar um modelo', '1'], ['Editar um modelo', '1'], ['Mover um bloco', '1 por posição'], ['Guardar', '1']],
  modelo: [['Mover um bloco', '1 por posição'], ['Adicionar um bloco', '1 (+nome)'], ['Guardar', '1']],
  definicoes: [['Mudar de tema', '1'], ['Voltar', '1']],
};
function guiaAtual() {
  if (S.screen === 'gravacao') return S.sheet ? 'ficha' : (S.live && S.live.model && S.live.model.hiit ? 'hiit' : 'gravacao');
  return S.screen;
}
function renderGuia() {
  const atual = guiaAtual(), toques = TOQUES[atual] || [];
  $('#guia').innerHTML = `
    <h1>Bricklap · nove ecrãs</h1>
    <p class="sub">Protótipo da sessão 13a: o fluxo aprovado na sessão 10, com o sistema visual da sessão 12 e a fiada e a fonte acertadas. <b>Premir</b> = manter meio segundo. Nada fica guardado.</p>
    <h2>Tema (como o atleta escolhe)</h2>
    <div class="temas">${TEMAS.map((t) => `<button class="${S.tema === t.id ? 'ativo' : ''}" data-tema="${t.id}">${t.nome}${t.pre ? ' ★' : ''}</button>`).join('')}</div>
    <h2>Ecrãs</h2>
    <ol>${ECRAS.map((e) => `<li><button class="${e.id === atual ? 'ativo' : ''}" data-go="${e.id}"><span class="n">${e.n}</span>${e.label}</button></li>`).join('')}</ol>
    <h2>Toques neste ecrã</h2>
    <table>${toques.map(([a, n]) => `<tr><td>${a}</td><td>${n}</td></tr>`).join('')}</table>
    <h2>Relógio</h2>
    <div class="ferramentas">
      <button class="${S.speed === 1 ? 'ativo' : ''}" data-speed="1">×1</button>
      <button class="${S.speed === 30 ? 'ativo' : ''}" data-speed="30">×30</button>
      <button data-reset>Reiniciar</button>
    </div>`;
}

/* =========================================================================
   Eventos
   ========================================================================= */
document.addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]');
  if (go) { S.sheet = null; S.picker = false; S.confirmDelete = null; ECRAS.find((e) => e.id === go.dataset.go).go(); render(); return; }
  const tm = ev.target.closest('[data-tema]');
  if (tm) { S.tema = tm.dataset.tema; render(); return; }
  const sp = ev.target.closest('[data-speed]');
  if (sp) { S.speed = +sp.dataset.speed; renderGuia(); return; }
  if (ev.target.closest('[data-reset]')) { location.reload(); return; }

  const el = ev.target.closest('[data-act]');
  if (!el || !$('#ecra').contains(el)) return;
  if (el.matches('.veu') && ev.target.closest('[data-stop]')) return;
  const act = el.dataset.act, id = el.dataset.id;
  const sessaoDeEdicao = () => S.post || S.view;
  switch (act) {
    case 'tab': S.tab = id; S.screen = id; S.confirmDelete = null; break;
    case 'ir': S.screen = id; break;
    case 'back-inicio': S.screen = S.tab === 'inicio' ? 'inicio' : S.tab; break;
    case 'start-sport': startSession(null, id); break;
    case 'start-model': startSession(MODELS.find((m) => m.id === id)); break;
    case 'picker': S.picker = true; break;
    case 'close-picker': S.picker = false; break;
    case 'change-sport': changeSport(id); return;
    case 'close-sheet': S.sheet = null; break;
    case 'save-sheet': saveSheet(); return;
    case 'step': stepDraft(el.dataset.field, +el.dataset.delta); return;
    case 'name': S.sheet.name = id; break;
    case 'serie': { const k = `${(sessaoDeEdicao() || {}).id}:${id}`; S.abertas.has(k) ? S.abertas.delete(k) : S.abertas.add(k); break; }
    case 'preencher': openSheet(sessaoDeEdicao(), +id, 'post'); break;
    case 'preencher-proximo': {
      const s = sessaoDeEdicao(), i = s.blocks.findIndex((b) => missing(b).length);
      if (i >= 0) { const g = gruposDeSerie(s); if (g) S.abertas.add(`${s.id}:${s.blocks[i].round}`); openSheet(s, i, 'post'); }
      break;
    }
    case 'finish': {
      const s = S.post; S.post = null;
      if (!S.sessions.find((x) => x.id === s.id)) { s.id = 's' + Date.now(); S.sessions.unshift(s); }
      S.view = s; S.screen = 'resumo'; S.tab = 'historico'; break;
    }
    case 'back': S.screen = 'historico'; S.tab = 'historico'; break;
    case 'open-session': S.view = S.sessions.find((s) => s.id === id); S.screen = 'resumo'; break;
    case 'ask-delete': S.confirmDelete = id; break;
    case 'cancel-delete': S.confirmDelete = null; break;
    case 'delete': S.sessions = S.sessions.filter((s) => s.id !== id); S.confirmDelete = null; toast('Sessão apagada'); break;
    case 'tema': S.tema = id; break;
    case 'edit-model': S.editModel = JSON.parse(JSON.stringify(MODELS.find((m) => m.id === id))); S.screen = 'modelo'; break;
    case 'new-model': S.editModel = { id: 'm' + Date.now(), name: 'Novo modelo', series: 3, hiit: false, blocks: [] }; S.screen = 'modelo'; break;
    case 'back-models': S.screen = 'modelos'; break;
    case 'save-model': {
      const m = S.editModel, i = MODELS.findIndex((x) => x.id === m.id);
      if (i >= 0) MODELS[i] = m; else MODELS.push(m);
      S.editModel = null; S.screen = 'modelos'; toast('Modelo guardado'); break;
    }
    case 'model-series': S.editModel.series = Math.max(1, S.editModel.series + +el.dataset.delta); break;
    case 'model-hiit': S.editModel.hiit = id === '1'; break;
    case 'mb-up': { const b = S.editModel.blocks, i = +id; [b[i - 1], b[i]] = [b[i], b[i - 1]]; break; }
    case 'mb-down': { const b = S.editModel.blocks, i = +id; [b[i + 1], b[i]] = [b[i], b[i + 1]]; break; }
    case 'mb-del': S.editModel.blocks.splice(+id, 1); break;
    case 'mb-add': {
      let nome = SPORTS[id].label;
      if (id === 'strength') { const n = prompt('Nome do exercício', 'Supino'); if (n === null) return; nome = n.trim() || nome; }
      if (id === 'rowing') nome = 'Remo';
      S.editModel.blocks.push({ sport: id, name: nome }); break;
    }
    default: return;
  }
  render();
});
document.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'notes' && S.post) S.post.notes = el.value;
  if (el.dataset.act === 'model-name') S.editModel.name = el.value;
});

/* Toque vs. premir, nos dois botões de treino. */
function bindLongPress() {
  const bind = (el, ms, aoToque, aoPremir) => {
    if (!el) return;
    let timer = null, premido = false;
    el.addEventListener('pointerdown', (ev) => {
      if (ev.button && ev.button !== 0) return;
      premido = false; el.classList.add('a-premir');
      timer = setTimeout(() => { premido = true; el.classList.remove('a-premir'); aoPremir(); }, ms);
    });
    el.addEventListener('pointerup', () => { if (timer === null) return; clearTimeout(timer); timer = null; el.classList.remove('a-premir'); if (!premido) aoToque(); });
    const cancela = () => { if (timer === null) return; clearTimeout(timer); timer = null; el.classList.remove('a-premir'); };
    el.addEventListener('pointerleave', cancela);
    el.addEventListener('pointercancel', cancela);
    el.addEventListener('contextmenu', (ev) => ev.preventDefault());
  };
  bind($('#marca'), 500, () => mark(false), () => mark(true));
  bind($('#parar'), 800, () => toast('Mantém premido para terminar'), stopSession);
}

/* Relógio do protótipo: mexe só nos números, sem re-render. */
setInterval(() => {
  if (!S.live || S.screen !== 'gravacao') return;
  S.clock += 200 * S.speed;
  const b = current(), t = $('[data-chrono="total"]'), bl = $('[data-chrono="bloco"]'), d = $('[data-dist]');
  if (t) t.textContent = fmtTime(S.clock);
  if (bl) bl.textContent = fmtTime(dur(b));
  if (d) d.textContent = fmtKm(streetDist(b));
}, 200);

/* ?ecra=<id>&tema=<preset>&solo=1 — é assim que as capturas são tiradas. */
(function inicio() {
  const q = new URLSearchParams(location.search);
  const tema = q.get('tema');
  if (tema && TEMAS.some((t) => t.id === tema)) S.tema = tema;
  /* Comparação de fontes (sessão 13a): ?fonte=anybody repõe a candidata da
     sessão 12 no ecrã real, para se compararem lado a lado e não num espécime
     isolado. A fonte do produto é a Archivo Expanded, carregada no <head>. */
  if (q.get('fonte') === 'anybody') {
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@125,600;125,700;125,800;125,900&display=swap';
    document.head.appendChild(l);
    document.documentElement.style.setProperty('--fonte-num', '"Anybody", "Inter", system-ui, sans-serif');
  }
  if (q.get('premido')) S.premido = true;
  const mk = parseInt(q.get('marca'), 10);
  if (mk >= 1 && mk <= 3) S.marca = mk;
  if (q.get('solo')) document.body.classList.add('solo');
  const e = q.get('ecra'), item = ECRAS.find((x) => x.id === e);
  if (item) item.go();
  render();
})();
</script>
