<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bricklap — protótipo dos nove ecrãs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wdth,wght@125,600;125,700;125,800;125,900&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   BRICKLAP — sistema visual (sessões 12 e 13a). O documento vivo é docs/DESIGN.md;
   este ficheiro é a sua primeira aplicação, nos nove ecrãs do protótipo.

   Dois temas de superfície (claro / escuro) e três presets que os combinam:
     claro    → tudo claro
     escuro   → tudo escuro
     hibrido  → treino escuro, consulta clara   (PREDEFINIDO)
     sistema  → segue o prefers-color-scheme
   O tema é escolha do atleta (decisão do fundador, sessão 12). Sem
   personalização livre de cores ou fontes.

   Identidade recorrente: (1) a FIADA — barra fina contínua de cantos
   arredondados, um troço por bloco, largura proporcional ao tempo, as cores a
   passar umas para as outras e uma junta ténue em cada marca (sessão 13a);
   (2) os NÚMEROS em Archivo Expanded, tabulares; (3) o ENTALHE — barra de
   3 px da cor do desporto na aresta esquerda de tudo o que é bloco.
   ========================================================================= */

/* ---------- Tokens: tema claro ---------- */
.t-claro {
  --fundo: #FBF8F4;
  --sup: #FFFFFF;
  --sup2: #F2ECE4;
  --linha: #E6DFD6;
  --tinta: #16120F;
  --tinta2: #5A524B;
  --tinta3: #948A81;
  --acento: #B03A2A;
  --acento-premido: #96301E;
  --acento-tinta: #9A3122;
  --acento-fundo: #F9EBE9;
  --sobre-acento: #FFFFFF;
  --veu: rgba(22, 18, 15, .55);
  --junta: rgba(255, 253, 250, .55);
  --sombra: 0 1px 2px rgba(22, 18, 15, .05), 0 10px 28px rgba(22, 18, 15, .07);
  --sombra-marca: 0 8px 24px rgba(176, 58, 42, .26);
  --d-forca: #6B4E3D;
  --d-passadeira: #2F6A94;
  --d-remo: #1F8079;
  --d-piscina: #1F8079;
  --d-rua: #4E8A3C;
  --d-bicicleta: #9A6A1E;
  --d-transicao: #7C756B;
}
/* ---------- Tokens: tema escuro ---------- */
.t-escuro {
  --fundo: #121010;
  --sup: #1C1917;
  --sup2: #272220;
  --linha: #332D2A;
  --tinta: #F7F2EC;
  --tinta2: #B5ABA2;
  --tinta3: #7A716A;
  --acento: #D14F3D;
  --acento-premido: #B03A2A;
  --acento-tinta: #E88073;
  --acento-fundo: #341714;
  --sobre-acento: #FFFFFF;
  --veu: rgba(0, 0, 0, .62);
  --junta: rgba(14, 12, 12, .6);
  --sombra: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .38);
  --sombra-marca: 0 8px 24px rgba(209, 79, 61, .22);
  --d-forca: #C49A82;
  --d-passadeira: #7FB2D9;
  --d-remo: #5FBDB4;
  --d-piscina: #5FBDB4;
  --d-rua: #8AC176;
  --d-bicicleta: #D9AE5E;
  --d-transicao: #A9A199;
}

:root {
  --fonte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fonte-num: "Archivo", "Inter", system-ui, sans-serif;
  /* espaçamento */
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 20px; --e6: 24px; --e7: 32px;
  /* raios */
  --r-s: 8px; --r-m: 12px; --r-g: 16px; --r-xl: 20px; --r-folha: 24px; --r-pill: 999px;
  /* alvo de toque em treino */
  --toque: 56px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--fonte);
  -webkit-font-smoothing: antialiased;
  background: #DCD5CB;
  color: #16120F;
  font-size: 15px;
  line-height: 1.35;
}
button { font: inherit; color: inherit; margin: 0; }
input, textarea { font: inherit; color: inherit; }

/* Números: a assinatura tipográfica. Archivo Expanded, tabular. */
.num {
  font-family: var(--fonte-num);
  font-variation-settings: "wdth" 125;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* =================== Palco (portátil): guia + telemóvel =================== */
.palco {
  display: grid; grid-template-columns: 320px 1fr; gap: var(--e7);
  max-width: 1180px; margin: 0 auto; padding: var(--e7) var(--e6);
  align-items: start; min-height: 100vh;
}
.guia {
  background: #FFFDFA; border: 1px solid #E6DFD6; border-radius: var(--r-g);
  padding: var(--e5); position: sticky; top: var(--e5); font-size: 13px; color: #5A524B;
}
.guia h1 { margin: 0 0 2px; font-size: 17px; font-weight: 800; color: #16120F; letter-spacing: -.01em; }
.guia .sub { margin: 0 0 var(--e4); line-height: 1.45; }
.guia h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #948A81; margin: var(--e5) 0 var(--e2); font-weight: 700; }
.guia ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.guia ol button {
  width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r-s);
  padding: 7px 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13px;
}
.guia ol button:hover { background: #F2ECE4; }
.guia ol button.ativo { background: #B03A2A; color: #fff; font-weight: 600; }
.guia ol .n { font-family: var(--fonte-num); font-variation-settings: "wdth" 125; font-weight: 700; min-width: 1.3em; }
.guia table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.guia td { padding: 5px 0; border-top: 1px solid #E6DFD6; vertical-align: top; }
.guia td:last-child { text-align: right; white-space: nowrap; font-weight: 700; color: #16120F; font-family: var(--fonte-num); font-variation-settings: "wdth" 125; }
.temas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.temas button {
  border: 1.5px solid #E6DFD6; background: #FBF8F4; border-radius: var(--r-s);
  padding: 8px 10px; cursor: pointer; font-size: 12.5px; font-weight: 600; text-align: left; color: #5A524B;
}
.temas button.ativo { border-color: #B03A2A; background: #F9EBE9; color: #9A3122; }
.guia .ferramentas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: var(--e2); }
.guia .ferramentas button { border: 1px solid #E6DFD6; background: #FBF8F4; border-radius: var(--r-s); padding: 6px 10px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
.guia .ferramentas button.ativo { background: #16120F; color: #fff; border-color: #16120F; }

.moldura { justify-self: center; width: 414px; padding: 12px; background: #17130F; border-radius: 46px; box-shadow: 0 30px 60px rgba(30, 20, 10, .3); }
.telemovel { width: 390px; height: 844px; border-radius: 36px; overflow: hidden; position: relative; display: flex; }

/* Modo captura: ?solo=1 — o ecrã ocupa a janela toda */
body.solo { overflow: hidden; }
body.solo .guia { display: none; }
body.solo .palco { display: block; padding: 0; max-width: none; }
body.solo .moldura { position: fixed; left: 0; top: 0; width: 390px; height: 100vh; padding: 0; background: none; border-radius: 0; box-shadow: none; }
body.solo .telemovel { width: 390px; height: 100vh; border-radius: 0; }

/* =========================== Ecrã =========================== */
.ecra {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  background: var(--fundo); color: var(--tinta); position: relative; overflow: hidden;
}
.barra-estado { height: 42px; flex: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 var(--e6) 5px; font-size: 12.5px; font-weight: 600; color: var(--tinta2); }
.barra-estado .marca-nome { letter-spacing: .06em; text-transform: uppercase; font-size: 11px; color: var(--tinta3); }
.rolar { flex: 1; overflow-y: auto; padding: 0 var(--e5) var(--e6); min-height: 0; }
.rolar::-webkit-scrollbar { width: 0; }
.rolar > h1 { margin: 14px 0 0; font-size: 27px; font-weight: 800; letter-spacing: -.022em; }
.rolar > .sub { margin-top: 3px; font-size: 13.5px; color: var(--tinta2); }

.icone { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icone.p { width: 18px; height: 18px; }
.icone.g { width: 28px; height: 28px; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta3); }

/* Cor por desporto (--d): só no ÍCONE e na fiada. As barras verticais na
   lateral dos cartões saíram na sessão 13b — o ícone já identifica o bloco e
   a barra era decoração a fingir que era dado. */
.d-strength { --d: var(--d-forca); }
.d-treadmill { --d: var(--d-passadeira); }
.d-rowing { --d: var(--d-remo); }
.d-pool { --d: var(--d-piscina); }
.d-run, .d-walk { --d: var(--d-rua); }
.d-bike { --d: var(--d-bicicleta); }
.d-transition { --d: var(--d-transicao); }

/* --------- Cabeçalho de ecrã de consulta --------- */
.cabeca { padding: var(--e3) var(--e5) 0; }
.cabeca .linha { display: flex; justify-content: space-between; align-items: center; gap: var(--e2); }
.cabeca h1 { margin: 2px 0 0; font-size: 27px; font-weight: 800; letter-spacing: -.022em; }
.cabeca .sub { margin-top: 3px; font-size: 13.5px; color: var(--tinta2); }
.redondo { width: 40px; height: 40px; border-radius: var(--r-pill); border: 1.5px solid var(--linha); background: var(--sup); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--tinta2); }
.voltar { display: flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 700; color: var(--acento-tinta); background: none; border: 0; padding: 6px 8px 6px 0; cursor: pointer; }

/* --------- Botões --------- */
.botao {
  min-height: var(--toque); padding: 0 var(--e4); border-radius: var(--r-m);
  border: 1.5px solid var(--linha); background: var(--sup); color: var(--tinta);
  display: flex; align-items: center; justify-content: center; gap: var(--e2);
  font-size: 17px; font-weight: 700; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.botao.acento { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
.botao.acento:active { background: var(--acento-premido); }
.botao.fantasma { background: transparent; border-color: transparent; color: var(--tinta2); font-weight: 600; }
.botao.perigo { color: var(--acento-tinta); }
.botao.pequeno { min-height: 44px; font-size: 15px; padding: 0 var(--e3); border-radius: var(--r-s); }
.botao.largo { width: 100%; }
.botoes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }

/* --------- Separadores (navegação de fundo) --------- */
.tabs { flex: none; display: flex; border-top: 1px solid var(--linha); background: var(--sup); padding: 6px 8px 14px; }
.tabs button { flex: 1; background: none; border: 0; padding: 8px 4px 4px; cursor: pointer; color: var(--tinta3); font-size: 11.5px; font-weight: 700; display: grid; justify-items: center; gap: 3px; letter-spacing: .02em; }
.tabs button.ativo { color: var(--acento-tinta); }

/* --------- Cartão --------- */
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e4); box-shadow: var(--sombra); }
.cartao.tocavel { cursor: pointer; }
.cartao.tocavel:active { background: var(--sup2); }
.lista { display: grid; gap: var(--e2); }

/* --------- FIADA: a assinatura. Barra contínua de cantos arredondados, um
   troço por bloco; são as cores a passar umas para as outras que os separam.
   A junta (1 px, um vinco da cor do fundo) aparece só onde a cor não muda:
   um corte mais forte partia a barra numa sessão de voltas iguais. --------- */
.fiada { position: relative; display: block; height: 6px; border-radius: var(--r-pill); overflow: hidden; min-width: 0; border: 0; box-shadow: none; }
.fiada.alta { height: 9px; }
.fiada i { position: absolute; top: -1px; bottom: -1px; width: 1px; background: var(--junta); transform: translateX(-.5px); }

/* --------- Chips --------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: var(--r-pill); border: 1.5px solid var(--linha); background: var(--sup); font-size: 14px; font-weight: 600; color: var(--tinta2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.chip.ativo { background: var(--tinta); border-color: var(--tinta); color: var(--fundo); }
.tijolo { min-height: var(--toque); border-radius: var(--r-m); border: 1.5px solid var(--linha); background: var(--sup); display: flex; align-items: center; gap: var(--e2); padding: 0 var(--e3); font-size: 15.5px; font-weight: 700; cursor: pointer; color: var(--tinta); text-align: left; }
.tijolo .icone { color: var(--d); }
.grelha { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }

/* =========================== Gravação =========================== */
.g-topo { padding: var(--e2) var(--e5) 0; display: flex; justify-content: space-between; align-items: center; gap: var(--e2); }
.g-topo .modelo { font-size: 14.5px; font-weight: 700; }
.pilula { font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: var(--r-pill); background: var(--sup2); color: var(--tinta2); white-space: nowrap; }
.chrono { padding: var(--e4) var(--e5) 0; }
.chrono .t { font-size: 84px; font-weight: 800; line-height: .92; letter-spacing: -.035em; }
.chrono .legenda { margin-top: var(--e2); display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--tinta2); font-weight: 500; }
.chrono .legenda b { color: var(--tinta); font-weight: 700; }
.chrono .fiada { margin-top: var(--e3); }

.bloco-atual { margin: var(--e4) var(--e5) 0; padding: var(--e4); border-radius: var(--r-g); background: var(--sup); border: 1px solid var(--linha); box-shadow: var(--sombra); }
.bloco-atual .cima { display: flex; align-items: center; gap: var(--e2); color: var(--d); }
.bloco-atual .linha { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e2); margin-top: 5px; }
.bloco-atual .nome { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.bloco-atual .tempo { font-size: 38px; font-weight: 700; letter-spacing: -.03em; }
.bloco-atual .ultima { margin-top: 5px; font-size: 13.5px; color: var(--tinta2); }
.bloco-atual .ultima b { color: var(--tinta); font-weight: 700; }
.bloco-atual .metricas { display: flex; gap: var(--e6); margin-top: var(--e3); }
.bloco-atual .metricas small { display: block; font-size: 11.5px; color: var(--tinta3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.bloco-atual .metricas b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }

.marcas { margin: var(--e3) var(--e5) 0; }
.marcas .l { display: flex; align-items: center; gap: var(--e2); padding: 9px 0; border-top: 1px solid var(--linha); font-size: 13.5px; }
.marcas .l:first-child { border-top: 0; }
.marcas .l .icone { color: var(--d); }
.marcas .l .n { flex: 1; font-weight: 600; }
.marcas .l .v { font-weight: 700; }
.marcas .l .v.em-falta { color: var(--acento-tinta); font-weight: 600; }
.marcas .l .t { width: 46px; text-align: right; color: var(--tinta2); font-weight: 600; }

.acoes { margin-top: auto; padding: var(--e3) var(--e5) var(--e6); display: grid; gap: var(--e2); }
/* --------- "A seguir": lugar próprio, acima do botão (sessão 13c) ---------
   Saiu de dentro do botão. Sem fundo e sem acento: o ecrã só tem um bloco de
   acento e é o Marca. 17/800 lê-se de relance e fica abaixo do nome do bloco
   atual (28/800) e do cronómetro (84/800). */
.proximo { display: flex; align-items: baseline; gap: var(--e2); min-height: 24px; padding: 0 2px; }
.proximo .kicker { flex: none; }
.proximo .nome { font-size: 17px; font-weight: 800; letter-spacing: -.01em; color: var(--tinta);
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* --------- Botão Marca: base comum aos três tratamentos ---------
   O gesto central da app. Sem instruções lá dentro: o que explica o premir é
   um indicador visual. Os três tratamentos estão em `?marca=1|2|3`. */
.marca {
  position: relative; width: 100%; border: 0; cursor: pointer; padding: 0;
  color: var(--sobre-acento);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.marca .rotulo { display: flex; align-items: center; gap: var(--e2); font-size: 29px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
.marca:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }

/* ===== 1 · TAMPO E SOQUETE. Um tampo de 102 px sobre um soquete de 108: em
   repouso vêem-se 6 px de aresta escura. O toque desce 3 px (90 ms) e a aresta
   fica em 3; o premir acaba de assentar até 6 px ao longo dos 500 ms e a aresta
   fecha. O que muda é a silhueta e a sombra, na borda e por baixo — fora da
   zona que o polegar tapa. ===== */
.m1 .marca { height: 108px; border-radius: var(--r-xl); background: var(--acento-premido);
  box-shadow: var(--sombra-marca); transition: box-shadow 160ms cubic-bezier(.2,.9,.3,1); }
.m1 .marca .face { position: absolute; left: 0; right: 0; top: 0; height: 102px;
  border-radius: var(--r-xl) var(--r-xl) 18px 18px; background: var(--acento);
  display: grid; place-items: center; overflow: hidden;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--sobre-acento) 14%, transparent);
  transform: translateY(0);
  transition: transform 160ms cubic-bezier(.2,.9,.3,1), background 160ms linear, box-shadow 160ms cubic-bezier(.2,.9,.3,1); }
.m1 .marca .rotulo { position: relative; z-index: 1; }
.m1 .marca:active, .m1 .marca.premido { box-shadow: 0 2px 8px color-mix(in srgb, var(--acento) 22%, transparent); transition: box-shadow 90ms cubic-bezier(.2,.7,.3,1); }
.m1 .marca:active .face, .m1 .marca.premido .face { transform: translateY(3px);
  background: color-mix(in srgb, var(--acento-premido) 45%, var(--acento));
  box-shadow: inset 0 2px 4px color-mix(in srgb, var(--acento-premido) 55%, transparent);
  transition: transform 90ms cubic-bezier(.2,.7,.3,1), background 90ms linear, box-shadow 90ms cubic-bezier(.2,.7,.3,1); }
.m1 .marca.a-premir .face { animation: assentar .5s linear forwards; }
@keyframes assentar { from { transform: translateY(3px) } to { transform: translateY(6px) } }
.m1 .marca .mare { position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
  background: color-mix(in srgb, var(--sobre-acento) 16%, transparent);
  transform: scaleY(0); transform-origin: 50% 100%; pointer-events: none; }
.m1 .marca.a-premir .mare { animation: mare .5s linear forwards; }
@keyframes mare { from { transform: scaleY(0) } to { transform: scaleY(1) } }

/* ===== 2 · O ANEL QUE FECHA. Tecla com base de 5 px que afunda 4 px ao toque
   (70 ms). Um carril gravado a 8 px da aresta é o bisel em repouso e o sítio
   por onde o anel corre: 90 ms de silêncio (um toque rápido não vê nada), 410
   ms a fechar o perímetro, e engrossa de 3 para 5 px nos últimos 29 ms. ===== */
.m2 .marca { height: 108px; margin-bottom: 5px; border-radius: var(--r-xl);
  background: var(--acento); display: grid; place-items: center; overflow: hidden;
  box-shadow: 0 5px 0 0 var(--acento-premido), var(--sombra-marca), inset 0 1.5px 0 0 rgba(255,255,255,.20);
  transition: transform 70ms cubic-bezier(.2,.7,.3,1), box-shadow 70ms linear, background-color 70ms linear; }
.m2 .marca:active, .m2 .marca.a-premir, .m2 .marca.premido { transform: translateY(4px); background: var(--acento-premido);
  box-shadow: 0 1px 0 0 var(--acento-premido), 0 3px 10px rgba(0,0,0,.18), inset 0 1.5px 0 0 rgba(255,255,255,.10); }
.m2 .marca::before { content: ''; position: absolute; inset: 8px; border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,.16); pointer-events: none; }
.m2 .marca .rotulo { font-size: 32px; letter-spacing: -.015em; gap: var(--e3); }
.m2 .marca .rotulo .icone { width: 30px; height: 30px; }
.m2 .marca .anel { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px);
  overflow: visible; pointer-events: none; opacity: 0; }
.m2 .marca .anel rect { fill: none; stroke: var(--sobre-acento); stroke-width: 3; stroke-linecap: round;
  stroke-dasharray: 100; stroke-dashoffset: 100; }
.m2 .marca.a-premir .anel { animation: anel-entra 110ms linear 90ms forwards; }
.m2 .marca.a-premir .anel rect { animation: anel-enche 410ms linear 90ms forwards; }
@keyframes anel-entra { from { opacity: 0 } to { opacity: 1 } }
@keyframes anel-enche { 0% { stroke-dashoffset: 100; stroke-width: 3 } 93% { stroke-dashoffset: 0; stroke-width: 3 } 100% { stroke-dashoffset: 0; stroke-width: 5 } }

/* ===== 3 · O TIJOLO DE TOPO. A silhueta deixa de ser um retângulo de cantos
   iguais: esquerda cortada a 8 px (encosta ao que já está construído), direita
   aberta a 30 px (é por ali que entra o bloco seguinte). A face afunda 4 px e o
   leito de 6 px encolhe para 2. O rótulo à esquerda, onde o polegar não cai. */
.m3 .marca { height: 110px; border-radius: 8px 30px 30px 8px; background: var(--acento-premido); box-shadow: var(--sombra-marca); }
.m3 .marca .face { position: absolute; left: 0; right: 0; top: 0; bottom: 6px; border-radius: inherit;
  background: var(--acento); display: flex; align-items: center; padding: 0 26px;
  transition: top .09s ease-out, bottom .09s ease-out; }
.m3 .marca .rotulo { gap: var(--e3); }
.m3 .marca .anel { position: absolute; inset: 10px; border: 3px solid rgba(255,255,255,.92);
  border-radius: 2px 20px 20px 2px; pointer-events: none; clip-path: inset(0 100% 0 0); }
.m3 .marca:active .face, .m3 .marca.a-premir .face, .m3 .marca.premido .face { top: 4px; bottom: 2px; }
.m3 .marca:active, .m3 .marca.premido { box-shadow: var(--sombra); }
.m3 .marca.a-premir .anel { animation: anelar .5s linear forwards; }
@keyframes anelar { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }

@media (prefers-reduced-motion: reduce) { .marca, .marca .face { transition-duration: 1ms; } }
.enche { position: absolute; left: 0; bottom: 0; height: 100%; width: 0; background: rgba(255, 255, 255, .16); }
.a-premir .enche { animation: encher .5s linear forwards; }
@keyframes encher { from { width: 0 } to { width: 100% } }
.parar { position: relative; overflow: hidden; }
.parar .enche { background: rgba(176, 58, 42, .16); top: 0; bottom: auto; }
.parar.a-premir .enche { animation: encher .8s linear forwards; }

/* =========================== Folha (ficha rápida, seletores) =========================== */
.veu { position: absolute; inset: 0; background: var(--veu); display: flex; align-items: flex-end; z-index: 5; }
.folha { width: 100%; background: var(--sup); border-radius: var(--r-folha) var(--r-folha) 0 0; padding: var(--e2) var(--e5) var(--e6); max-height: 93%; overflow-y: auto; animation: subir .18s ease-out; }
@keyframes subir { from { transform: translateY(26px); opacity: .5 } to { transform: none; opacity: 1 } }
.folha::-webkit-scrollbar { width: 0; }
.folha .pega { width: 36px; height: 4px; border-radius: 2px; background: var(--linha); margin: 6px auto var(--e4); }
.folha .cabeca-f { display: flex; align-items: center; gap: var(--e2); }
.folha .cabeca-f .icone { color: var(--d); }
.folha h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.02em; }
.folha .sub { font-size: 13px; color: var(--tinta2); margin: 3px 0 0 30px; }
.folha .chips { margin: var(--e4) 0 var(--e1); }
.campo { display: flex; justify-content: space-between; align-items: center; gap: var(--e3); padding: var(--e3) 0; border-top: 1px solid var(--linha); }
.campo:first-of-type { border-top: 0; }
.campo label { font-size: 15.5px; font-weight: 700; }
.campo label small { display: block; font-size: 12px; font-weight: 500; color: var(--tinta3); margin-top: 2px; }
.campo.calculado label { font-weight: 600; color: var(--tinta2); }
.campo .lido { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); }
.passo { display: flex; align-items: center; gap: 5px; }
.passo button { width: var(--toque); height: var(--toque); border-radius: var(--r-m); border: 1.5px solid var(--linha); background: var(--sup2); color: var(--tinta); display: grid; place-items: center; cursor: pointer; }
.passo button:active { background: var(--linha); }
.passo .v { min-width: 94px; text-align: center; font-size: 29px; font-weight: 800; letter-spacing: -.025em; }
.passo .v small { font-size: 13px; font-weight: 700; color: var(--tinta2); margin-left: 3px; letter-spacing: 0; }
.folha .botoes { margin-top: var(--e4); grid-template-columns: 1fr 1.5fr; }
.nota { font-size: 12px; color: var(--tinta3); margin-top: var(--e2); line-height: 1.45; }

/* =========================== Herói de consulta =========================== */
.heroi { display: grid; gap: 6px; margin-top: var(--e3); }
.heroi .total { font-size: 72px; font-weight: 800; line-height: .9; letter-spacing: -.04em; }
.heroi .lado { display: flex; flex-wrap: wrap; gap: 2px var(--e4); }
.heroi .lado span { font-size: 13px; color: var(--tinta2); font-weight: 500; }
.heroi .lado b { font-size: 16px; font-weight: 800; color: var(--tinta); margin-right: 5px; letter-spacing: -.01em; }

/* Cartão "por preencher" — um aviso ÚTIL, não um alarme (sessão 13b).
   Fundo de acento muito leve para não desaparecer na pilha de cartões do
   resumo; o título em tinta normal e o acento só no rótulo, no ícone e no
   botão; hierarquia o que falta > detalhe > ação, com o botão a ter largura
   própria numa linha só dele. */
.aviso { margin-top: var(--e4); padding: var(--e4) var(--e5); border-radius: var(--r-g); background: var(--acento-fundo);
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "i k" "t t" "d d" "b b"; gap: 0 var(--e2); align-items: center; }
.aviso .icone { grid-area: i; color: var(--acento-tinta); }
.aviso .kick { grid-area: k; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--acento-tinta); }
.aviso b { grid-area: t; font-size: 16.5px; font-weight: 800; letter-spacing: -.01em; color: var(--tinta); margin-top: 7px; }
.aviso .det { grid-area: d; font-size: 13px; font-weight: 500; line-height: 1.45; color: var(--tinta2); margin-top: 3px; }
.aviso .botao { grid-area: b; justify-self: end; min-width: 140px; min-height: 44px; padding: 0 var(--e4); font-size: 15px; border-radius: var(--r-s); margin-top: var(--e3); }
.heroi .lado span { white-space: nowrap; }

/* Secção */
.secao { margin-top: var(--e6); }
.secao > .titulo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--e2); }
.secao > .titulo h3 { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta3); }
.secao > .titulo span { font-size: 12.5px; color: var(--tinta3); font-weight: 500; }

/* Cartão por exercício */
.ex { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e3) var(--e4);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 3px var(--e3); }
.ex .nome { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; }
.ex .nome .icone { color: var(--d); }
.ex .n { font-size: 25px; font-weight: 800; letter-spacing: -.025em; text-align: right; white-space: nowrap; }
.ex .det { font-size: 12.5px; color: var(--tinta2); font-weight: 500; }
.ex .det.em-falta { color: var(--acento-tinta); font-weight: 600; }
.ex .sub-n { font-size: 12.5px; font-weight: 600; color: var(--tinta2); text-align: right; white-space: nowrap; }

/* =========================== Tabela de séries (expansível) =========================== */
.series { display: grid; gap: 6px; }
.serie { border: 1px solid var(--linha); border-radius: var(--r-m); background: var(--sup); overflow: hidden; }
.serie.aberta { border-color: var(--tinta3); }
.serie-cab { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto auto; align-items: center; gap: var(--e3); width: 100%; padding: var(--e3); background: none; border: 0; cursor: pointer; text-align: left; min-height: 52px; }
.serie-cab .n { font-size: 17px; font-weight: 800; color: var(--tinta2); text-align: center; }
.serie-cab .meio { min-width: 0; display: grid; gap: 5px; }
.serie-cab .rot { font-size: 12px; color: var(--tinta3); font-weight: 600; }
.serie-cab .t { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.serie-cab .seta { color: var(--tinta3); transition: transform .15s; }
.serie.aberta .serie-cab .seta { transform: rotate(180deg); }
.selo { min-width: 22px; height: 22px; border-radius: var(--r-pill); background: var(--acento-fundo); color: var(--acento-tinta); font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
.serie-corpo { border-top: 1px solid var(--linha); }
.linha-bloco { display: grid; grid-template-columns: 1fr auto 46px; align-items: center; gap: var(--e2); padding: 10px var(--e3); border-top: 1px solid var(--linha); }
.linha-bloco:first-child { border-top: 0; }
.linha-bloco .nome { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; min-width: 0; }
.linha-bloco .nome .icone { color: var(--d); }
.linha-bloco .valor { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
.linha-bloco .valor small { font-weight: 600; color: var(--tinta2); font-size: 12px; }
.linha-bloco .t { font-size: 13px; color: var(--tinta2); text-align: right; font-weight: 600; }
.linha-bloco .preencher { border: 1.5px dashed var(--acento); background: var(--acento-fundo); color: var(--acento-tinta); border-radius: var(--r-pill); padding: 5px 11px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.legenda { display: flex; gap: var(--e3); flex-wrap: wrap; margin-top: var(--e3); font-size: 12px; color: var(--tinta2); font-weight: 500; }
.legenda span { display: flex; align-items: center; gap: 5px; }
.legenda .icone { color: var(--d); }

/* Notas */
.notas { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e3) var(--e4); font-size: 14px; line-height: 1.5; color: var(--tinta2); }
textarea.notas { width: 100%; min-height: 86px; resize: vertical; display: block; }
.notas.vazia { color: var(--tinta3); }

/* =========================== Histórico =========================== */
.sessao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e3) var(--e4); }
.sessao .cima { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--e2); cursor: pointer; }
.sessao .quando { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta3); }
.sessao h3 { margin: 2px 0 0; font-size: 17px; font-weight: 800; letter-spacing: -.015em; }
.sessao .meta { font-size: 13px; color: var(--tinta2); margin-top: 1px; }
.sessao .dur { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.sessao .fiada { margin-top: var(--e3); }
.sessao .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: var(--e2); }
.sessao .selo-falta { font-size: 12px; font-weight: 700; color: var(--acento-tinta); }
.sessao .confirmar { margin-top: var(--e3); padding-top: var(--e3); border-top: 1px dashed var(--acento); display: flex; justify-content: space-between; align-items: center; gap: var(--e2); }
.sessao .confirmar span { font-size: 13px; font-weight: 700; color: var(--acento-tinta); }
.vazio { text-align: center; color: var(--tinta3); padding: var(--e7) 0; }

/* =========================== Modelos =========================== */
.mb { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--e2); background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r-m); padding: var(--e2) var(--e3); }
.mb .nome { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; }
.mb .nome .icone { color: var(--d); }
.mb .desp { font-size: 12.5px; color: var(--tinta3); margin-top: 1px; }
.mb .setas { display: flex; gap: 4px; }
.mb .setas button { width: 40px; height: 40px; border-radius: var(--r-s); border: 1.5px solid var(--linha); background: var(--sup2); color: var(--tinta2); display: grid; place-items: center; cursor: pointer; }
.mb .setas button:disabled { opacity: .35; }
.linha-campo { display: flex; justify-content: space-between; align-items: center; gap: var(--e3); padding: var(--e3) 0; border-top: 1px solid var(--linha); }
.linha-campo label { font-size: 15.5px; font-weight: 700; }
.linha-campo label small { display: block; font-size: 12px; font-weight: 500; color: var(--tinta3); margin-top: 2px; }
.linha-campo input[type=text] { width: 190px; min-height: 46px; border: 1.5px solid var(--linha); border-radius: var(--r-m); padding: 0 var(--e3); background: var(--sup2); font-weight: 700; }
.alternar { display: inline-flex; border: 1.5px solid var(--linha); border-radius: var(--r-pill); overflow: hidden; }
.alternar button { border: 0; background: var(--sup2); padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--tinta2); }
.alternar button.ativo { background: var(--tinta); color: var(--fundo); }

/* =========================== Definições (seletor de tema) =========================== */
.tema-op { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--e3); background: var(--sup); border: 1.5px solid var(--linha); border-radius: var(--r-g); padding: var(--e3) var(--e4); cursor: pointer; text-align: left; width: 100%; }
.tema-op.ativa { border-color: var(--acento); background: var(--acento-fundo); }
.tema-op .nome { display: block; font-size: 16px; font-weight: 800; }
.tema-op .nome em { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acento-tinta); margin-left: 7px; }
.tema-op .exp { display: block; font-size: 12.5px; color: var(--tinta2); margin-top: 2px; line-height: 1.35; }
.amostra { display: flex; gap: 3px; }
.amostra i { width: 17px; height: 34px; border-radius: 3px; border: 1px solid rgba(128, 118, 108, .45); display: block; }
.amostra i.clara { background: #FBF8F4; }
.amostra i.escura { background: #17140F; }
.amostra i.acento { background: var(--acento); border-color: transparent; width: 7px; align-self: center; height: 22px; }
.tema-op .certo { color: var(--acento-tinta); }
.tema-op .certo.off { color: var(--linha); }

/* Toast */
.toast { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); background: var(--tinta); color: var(--fundo); padding: 10px 16px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 700; z-index: 9; white-space: nowrap; animation: toast 2.2s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px) } 12% { opacity: 1; transform: translate(-50%, 0) } 80% { opacity: 1 } 100% { opacity: 0 } }

/* Ecrãs estreitos: o telemóvel ocupa tudo */
@media (max-width: 900px) {
  body { background: #DCD5CB; }
  .palco { display: block; padding: 0; }
  .guia { position: static; border-radius: 0; border-width: 0 0 1px; }
  .moldura { width: 100%; padding: 0; background: none; border-radius: 0; box-shadow: none; }
  .telemovel { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; }
}
</style>

<script>
'use strict';
/* =========================================================================
   Modelo de dados do PROTÓTIPO (não é código de produto).
   Sessão → blocos. "Marca" fecha o bloco atual e abre o seguinte sem mudar
   de desporto; "Mudar" fecha e abre com outro desporto. O fluxo é o da
   sessão 10, aprovado pelo fundador e pelo CTO — aqui só muda o visual.
   ========================================================================= */
const SPORTS = {
  strength:   { label: 'Força',             live: 'Força',         gps: false, ficha: 'forca',      grupo: 'ginasio' },
  treadmill:  { label: 'Passadeira',        live: 'Na passadeira', gps: false, ficha: 'passadeira', grupo: 'ginasio' },
  rowing:     { label: 'Remo indoor',       live: 'A remar',       gps: false, ficha: 'metros',     grupo: 'ginasio' },
  pool:       { label: 'Natação (piscina)', live: 'A nadar',       gps: false, ficha: 'metros',     grupo: 'ginasio' },
  run:        { label: 'Corrida',           live: 'A correr',      gps: true,  ficha: 'rua',        grupo: 'rua', vel: 2.9 },
  walk:       { label: 'Caminhada',         live: 'A caminhar',    gps: true,  ficha: 'rua',        grupo: 'rua', vel: 1.4 },
  bike:       { label: 'Bicicleta',         live: 'De bicicleta',  gps: true,  ficha: 'rua',        grupo: 'rua', vel: 7.4 },
  transition: { label: 'Transição',         live: 'Transição',     gps: true,  ficha: 'nada',       grupo: 'rua', vel: 0.7 },
};
const ORDEM = ['strength', 'treadmill', 'rowing', 'pool', 'run', 'walk', 'bike', 'transition'];

let MODELS = [
  { id: 'm5x5', name: 'Circuito 5×5', series: 5, hiit: false, blocks: [
    { sport: 'strength', name: 'Supino' },
    { sport: 'treadmill', name: 'Passadeira' },

];

/* Valores da última vez: por exercício (força) ou por desporto. */
const LAST = {
  'supino': { reps: 10, kg: 85 },
  'agachamento': { reps: 8, kg: 105 },
  'elevações': { reps: 8, kg: 0 },
  'flexões': { reps: 15, kg: 0 },
  treadmill: { paceS: 330, entered: 'pace' },
  rowing: { meters: 500 },
  pool: { meters: 50 },
};

const TREINO = new Set(['gravacao']);
const S = {
  screen: 'inicio', tab: 'inicio', tema: 'hibrido', marca: 3, premido: false,
  live: null, post: null, view: null, sheet: null, picker: false,
  confirmDelete: null, editModel: null, abertas: new Set(),
  clock: 0, speed: 1, sessions: [],
};

/* ---------------------------- utilidades ---------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ico = (id, cls) => `<svg class="icone${cls ? ' ' + cls : ''}"><use href="#i-${id}"/></svg>`;
function fmtTime(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`;
}
function fmtKm(m) { return (m / 1000).toFixed(2).replace('.', ',').replace(/,?0+$/, '') + ' km'; }
function fmtKmCurto(m) { return (m / 1000).toFixed(1).replace('.', ',') + ' km'; }
function fmtM(m) { return String(Math.round(m)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' m'; }
function fmtPace(s) { s = Math.round(s); return `${Math.floor(s / 60)}:${pad(s % 60)}`; }
function fmtKg(kg) { return String(kg).replace('.', ',') + ' kg'; }
function dur(b) { return (b.endAt ?? S.clock) - b.startAt; }
function key(b) { return b.sport === 'strength' ? b.name.trim().toLowerCase() : b.sport; }
function lastFor(b) { return LAST[key(b)] || {}; }
function fichaDe(b) { return SPORTS[b.sport].ficha; }
function streetDist(b) { return dur(b) / 1000 * (SPORTS[b.sport].vel || 0); }
function horaAtual() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('#telemovel').appendChild(t); setTimeout(() => t.remove(), 2300);
}
/* Tema efetivo de cada ecrã: é aqui que o preset "híbrido" se decide. */
function temaDoEcra(screen) {
  if (S.tema === 'claro') return 'claro';
  if (S.tema === 'escuro') return 'escuro';
  if (S.tema === 'sistema') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
  return TREINO.has(screen) ? 'escuro' : 'claro';
}

/* Campos que faltam a um bloco, pela ficha do seu desporto. */
function missing(b) {
  if (b.hiit) return [];
  const f = b.fields || {};
  switch (fichaDe(b)) {
    case 'forca': return ['reps', 'kg'].filter((k) => f[k] === undefined);
    case 'passadeira': return (f.paceS === undefined && f.distM === undefined) ? ['ritmo'] : [];
    case 'metros': return f.meters === undefined ? ['metros'] : [];
    default: return [];
  }
}
/* Passadeira: o tempo do bloco já é conhecido, logo ritmo ⇄ distância. */
function treadmillCalc(b) {
  const f = b.fields || {}, secs = dur(b) / 1000;
  if (f.entered === 'dist' && f.distM) return { distM: f.distM, paceS: secs / (f.distM / 1000) };
  if (f.paceS) return { paceS: f.paceS, distM: secs / f.paceS * 1000 };
  return null;
}
/* Valor de um bloco, tal como aparece nas tabelas e nas listas. */
function valorDoBloco(b) {
  const f = b.fields || {}, fi = fichaDe(b), falta = missing(b).length > 0;
  if (falta) return { falta: true, html: '' };
  if (b.hiit) return { falta: false, html: '' };
  if (fi === 'forca') return { falta: false, html: f.kg ? `${f.reps} × ${fmtKg(f.kg)}` : `${f.reps} reps` };
  if (fi === 'passadeira') { const c = treadmillCalc(b); return { falta: false, html: `${fmtKmCurto(c.distM)} <small>@ ${fmtPace(c.paceS)}</small>` }; }
  if (fi === 'metros') return { falta: false, html: fmtM(f.meters) };
  if (fi === 'rua') return { falta: false, html: `${fmtKm(streetDist(b))} <small>@ ${fmtPace(1000 / SPORTS[b.sport].vel)}</small>` };
  return { falta: false, html: '<small>só tempo</small>' };
}

/* ------------------------ sessões de demonstração ------------------------ */
function demoSession(id) {
  const m = MODELS[0];
  const durs = { Supino: [85, 88, 90, 84, 92], Passadeira: [165, 168, 162, 170, 166], Remo: [115, 118, 112, 120, 117], Agachamento: [75, 78, 80, 77, 76], 'Elevações': [60, 58, 64, 60, 50] };
  const kgs = { Supino: [80, 80, 85, 85, 85], Agachamento: [100, 100, 100, 105, 105] };
  const reps = { Supino: 10, Agachamento: 8, 'Elevações': 8 };
  const blocks = []; let t = 0;
  for (let r = 0; r < 5; r++) m.blocks.forEach((mb, i) => {
    const d = durs[mb.name][r] * 1000;
    const b = { sport: mb.sport, name: mb.name, startAt: t, endAt: t + d, fields: {}, modelIndex: i, round: r };
    if (mb.sport === 'strength') b.fields = { reps: reps[mb.name], kg: kgs[mb.name] ? kgs[mb.name][r] : 0 };
    if (mb.sport === 'treadmill') b.fields = { paceS: 330, entered: 'pace' };
    if (mb.sport === 'rowing') b.fields = { meters: 500 };
    /* Três blocos ficam de propósito por preencher, para se ver o estado. */
    if (r === 2 && mb.sport === 'treadmill') b.fields = {};
    if (r === 3 && mb.sport === 'rowing') b.fields = {};
    if (r === 4 && mb.name === 'Supino') b.fields = { reps: 10 };
    blocks.push(b); t += d;
  });
  return { id: id || 'demo', name: m.name, model: m, when: 'Hoje', startedAt: '07:40', terminouAs: '08:22', blocks, stoppedAt: t,
    notes: 'Supino a 85 kg nas últimas três. A passadeira desligou-se na série 3, daí o buraco.' };
}
function simpleSession(id, when, startedAt, sport, name, secs, fields) {
  return { id, when, startedAt, name, model: null, blocks: [{ sport, name, startAt: 0, endAt: secs * 1000, fields: fields || {}, modelIndex: 0, round: 0 }], stoppedAt: secs * 1000, notes: '' };
}
function amrapSession() {
  const laps = [82, 85, 88, 84, 90, 87, 91, 86, 93, 89, 92, 95, 90, 88], blocks = []; let t = 0;
  laps.forEach((s, i) => { blocks.push({ sport: 'strength', name: `Volta ${i + 1}`, startAt: t, endAt: t + s * 1000, fields: {}, modelIndex: 0, round: i, hiit: true }); t += s * 1000; });
  return { id: 'amrap1', name: 'AMRAP 20 min', model: MODELS[1], when: 'Terça', startedAt: '18:05', blocks, stoppedAt: t,
    notes: '14 voltas de 10 burpees + 10 agachamentos + 200 m remo. A última a morrer.' };
}
S.sessions = [
  demoSession(),
  simpleSession('run1', 'Ontem', '07:15', 'run', 'Corrida', 26 * 60 + 40),
  amrapSession(),
  simpleSession('walk1', 'Quarta', '07:20', 'walk', 'Caminhada', 48 * 60 + 12),
  simpleSession('junk', 'Quarta', '00:17', 'walk', 'Caminhada', 17),
];

/* ------------------------------ gravação ------------------------------ */
function startSession(model, sport) {
  S.clock = 0;
  const first = model ? model.blocks[0] : { sport, name: SPORTS[sport].label };
  S.live = {
    id: 'live', name: model ? model.name : SPORTS[sport].label, model, when: 'Hoje', startedAt: horaAtual(),
    blocks: [{ sport: first.sport, name: model && model.hiit ? 'Volta 1' : first.name, startAt: 0, endAt: null, fields: {}, modelIndex: 0, round: 0, hiit: !!(model && model.hiit) }],
    stoppedAt: null, notes: '',
  };
  S.screen = 'gravacao'; S.sheet = null; S.picker = false;
}
function current() { return S.live.blocks[S.live.blocks.length - 1]; }
function nextBlockAfter(b) {
  const m = S.live.model;
  if (!m) return { sport: b.sport, name: b.name, modelIndex: 0, round: (b.round || 0) + 1 };
  if (m.hiit) return { sport: b.sport, name: `Volta ${b.round + 2}`, modelIndex: 0, round: b.round + 1, hiit: true };
  const i = (b.modelIndex + 1) % m.blocks.length, round = i === 0 ? b.round + 1 : b.round;
  return { sport: m.blocks[i].sport, name: m.blocks[i].name, modelIndex: i, round };
}
function mark(comFicha) {
  const b = current(); b.endAt = S.clock;
  const n = nextBlockAfter(b);
  S.live.blocks.push({ sport: n.sport, name: n.name, startAt: S.clock, endAt: null, fields: {}, modelIndex: n.modelIndex, round: n.round, hiit: n.hiit });
  const hiit = S.live.model && S.live.model.hiit;
  if (comFicha && hiit) toast('Em HIIT preenche-se no fim');
  else if (comFicha && (fichaDe(b) === 'rua' || fichaDe(b) === 'nada')) toast('Na rua não há nada a preencher');
  else if (comFicha) openSheet(S.live, S.live.blocks.length - 2, 'live');
  render();
}
function changeSport(sport) {
  const b = current(); b.endAt = S.clock;
  S.live.blocks.push({ sport, name: SPORTS[sport].label, startAt: S.clock, endAt: null, fields: {}, modelIndex: 0, round: b.round || 0 });
  S.picker = false; render();
}
function stopSession() {
  const b = current(); b.endAt = S.clock; S.live.stoppedAt = S.clock;
  if (dur(b) < 1000 && S.live.blocks.length > 1) S.live.blocks.pop();
  S.post = S.live; S.live = null;
  S.post.blocks.forEach((x) => { if (x.endAt === null) x.endAt = S.post.stoppedAt; });
  S.post.terminouAs = horaAtual();
  /* Abre as séries que têm blocos por preencher. */
  S.abertas = new Set();
  gruposDeSerie(S.post).forEach((g, i) => { if (g.blocos.some((x) => missing(x).length)) S.abertas.add(`${S.post.id}:${i}`); });
  S.screen = 'pos'; render();
}

/* ----------------------------- ficha rápida ----------------------------- */
function openSheet(session, index, context) {
  const b = session.blocks[index], last = lastFor(b), draft = Object.assign({}, last, b.fields);
  if (fichaDe(b) === 'forca') { draft.reps = draft.reps ?? 10; draft.kg = draft.kg ?? 20; }
  if (fichaDe(b) === 'passadeira') { draft.entered = draft.entered || 'pace'; draft.paceS = draft.paceS ?? 330; }
  if (fichaDe(b) === 'metros') { draft.meters = draft.meters ?? (b.sport === 'pool' ? 50 : 500); }
  S.sheet = { session, index, context, draft, name: b.name };
}
function saveSheet() {
  const { session, index, draft, name } = S.sheet, b = session.blocks[index], f = fichaDe(b);
  b.name = name.trim() || b.name;
  if (f === 'forca') b.fields = { reps: draft.reps, kg: draft.kg };
  if (f === 'passadeira') b.fields = draft.entered === 'dist' ? { distM: draft.distM, entered: 'dist' } : { paceS: draft.paceS, entered: 'pace' };
  if (f === 'metros') b.fields = { meters: draft.meters };
  LAST[key(b)] = Object.assign({}, b.fields);
  S.sheet = null; render();
}
function stepDraft(field, delta) {
  const d = S.sheet.draft, b = S.sheet.session.blocks[S.sheet.index];
  if (field === 'paceS') { d.entered = 'pace'; d.paceS = Math.max(120, (d.paceS ?? 330) + delta); delete d.distM; }
  else if (field === 'distM') {
    d.entered = 'dist';
    if (d.distM === undefined) { const c = treadmillCalc({ ...b, fields: { paceS: d.paceS, entered: 'pace' } }); d.distM = c ? Math.round(c.distM / 50) * 50 : 500; }
    d.distM = Math.max(100, d.distM + delta);
  } else d[field] = Math.max(0, +((d[field] ?? 0) + delta).toFixed(1));
  render();
}

/* ------------------- agrupamentos para tabelas e resumos ------------------- */
function gruposDeSerie(session) {
  const m = session.model;
  if (m && !m.hiit && m.blocks.length > 1) {
    const n = Math.max(...session.blocks.map((b) => b.round)) + 1;
    return Array.from({ length: n }, (_, r) => ({ rot: `Série ${r + 1}`, blocos: session.blocks.filter((b) => b.round === r) }));
  }
  return null;   /* HIIT e sessões de um só desporto: lista plana de blocos */
}
function agrupaPorExercicio(session) {
  const g = new Map();
  session.blocks.forEach((b) => {
    const k = fichaDe(b) === 'rua' ? b.sport : key(b);
    if (!g.has(k)) g.set(k, { name: b.name, sport: b.sport, blocos: [] });
    g.get(k).blocos.push(b);
  });
  return [...g.values()];
}
/* Números principais de um exercício: "5×10 / 80–85 kg", "2,0 km / 4 × 0,5 km @ 5:30". */
function resumoExercicio(gr) {
  const bs = gr.blocos, fi = fichaDe(bs[0]), ok = bs.filter((b) => !missing(b).length), falta = bs.length - ok.length;
  const faixa = (v, f) => { const a = f(Math.min(...v)), z = f(Math.max(...v)); return a === z ? a : `${a}–${z}`; };
  let n = '—', det = '';
  if (fi === 'forca') {
    if (ok.length) {
      n = `${ok.length}×${faixa(ok.map((b) => b.fields.reps), String)}`;
      const kgs = ok.map((b) => b.fields.kg).filter((k) => k > 0);
      det = kgs.length ? faixa(kgs, (k) => String(k).replace('.', ',')) + ' kg' : 'peso do corpo';
    } else { n = `${bs.length}×?`; det = 'nada preenchido'; }
  } else if (fi === 'passadeira') {
    const cs = ok.map(treadmillCalc);
    if (ok.length) { n = fmtKmCurto(cs.reduce((a, c) => a + c.distM, 0)); det = `${ok.length} × ${faixa(cs.map((c) => c.distM), fmtKmCurto)} @ ${faixa(cs.map((c) => c.paceS), fmtPace)}`; }
    else { n = '—'; det = 'nada preenchido'; }
  } else if (fi === 'metros') {
    if (ok.length) { n = fmtM(ok.reduce((a, b) => a + b.fields.meters, 0)); det = `${ok.length} × ${faixa(ok.map((b) => b.fields.meters), fmtM)}`; }
    else { n = '—'; det = 'nada preenchido'; }
  } else if (fi === 'rua') {
    const d = bs.reduce((a, b) => a + streetDist(b), 0), t = bs.reduce((a, b) => a + dur(b), 0);
    n = fmtKm(d); det = `${fmtPace(t / 1000 / (d / 1000))} /km · ${fmtTime(t)}`;
  } else { n = String(bs.length) + '×'; det = fmtTime(bs.reduce((a, b) => a + dur(b), 0)); }
  return { n, det, falta, total: bs.length };
}
function distanciaTotal(session) {
  return session.blocks.reduce((a, b) => {
    if (SPORTS[b.sport].gps) return a + streetDist(b);
    if (missing(b).length) return a;
    if (fichaDe(b) === 'passadeira') return a + treadmillCalc(b).distM;
    if (fichaDe(b) === 'metros') return a + b.fields.meters;
    return a;
  }, 0);
}
function blocosEmFalta(session) { return session.blocks.filter((b) => missing(b).length); }
function frasesEmFalta(session) {
  const gs = gruposDeSerie(session);
  return blocosEmFalta(session).map((b) => {
    if (!gs) return b.name;
    const i = b.round + 1, o = missing(b);
    const que = fichaDe(b) === 'forca' && o.length === 1 ? (o[0] === 'kg' ? 'carga do ' : 'reps do ') : '';
    return `${que}${b.name} (série ${i})`;
  });
}

/* =========================================================================
   Render
   ========================================================================= */
function barraEstado() {
  return `<div class="barra-estado"><span class="num">${horaAtual()}</span><span class="marca-nome"></span></div>`;
}
function viewTabs() {
  const t = (id, label, icone) => `<button class="${S.tab === id ? 'ativo' : ''}" data-act="tab" data-id="${id}">${ico(icone)}<span>${label}</span></button>`;
  return `<nav class="tabs">${t('inicio', 'Início', 'inicio')}${t('historico', 'Histórico', 'historico')}${t('modelos', 'Modelos', 'modelos')}</nav>`;
}
/* A FIADA (redesenhada na sessão 13a). Um troço por bloco, largura proporcional
   ao tempo, numa barra fina contínua: são as CORES a passar umas para as outras
   que separam os blocos, não a argamassa. A junta — 1,5 px da cor do fundo —
   aparece só onde a cor NÃO muda (força a seguir a força), que é o único sítio
   onde sem ela se perdia um bloco. Piso de largura: 82 % proporção + 18 %
   repartido por igual, para nenhum troço desaparecer numa sessão de 25 blocos.
   COR_D espelha o bloco `.d-*` do CSS, lá em cima. */
const COR_D = { strength: 'forca', treadmill: 'passadeira', rowing: 'remo', pool: 'piscina', run: 'rua', walk: 'rua', bike: 'bicicleta', transition: 'transicao' };
/* O botão Marca, nos três tratamentos da sessão 13c. Nenhum leva instruções
   lá dentro: quem explica o premir é o indicador visual de cada um. */
function botaoMarca() {
  const rot = `<span class="rotulo">${ico('marca', 'g')}Marca</span>`;
  const aria = 'aria-label="Marca. Premir abre a ficha do bloco que acabou."';
  const cls = S.premido ? 'marca a-premir premido' : 'marca';
  if (S.marca === 2) return `<button class="${cls}" id="marca" ${aria}><svg class="anel" aria-hidden="true"><rect pathLength="100" width="100%" height="100%" rx="12"/></svg>${rot}</button>`;
  if (S.marca === 3) return `<button class="${cls}" id="marca" ${aria}><span class="face"><span class="anel"></span>${rot}</span></button>`;
  return `<button class="${cls}" id="marca" ${aria}><span class="face"><span class="mare"></span>${rot}</span></button>`;
}
function fiadaDe(blocos, alta) {
  if (!blocos.length) return '';
  const tok = (b) => COR_D[b.sport] || 'transicao';
  const durs = blocos.map((b) => Math.max(1, dur(b) || 0));
  const total = durs.reduce((a, d) => a + d, 0), igual = 100 / blocos.length;
  const ws = durs.map((d) => 0.82 * (d / total * 100) + 0.18 * igual);
  /* A cor da fiada é a do desporto a 84 % sobre o fundo do tema — menos saturada
     do que o ícone, que fica com a cor cheia. É `color-mix` e NÃO `opacity`: a
     opacidade apagava também o vinco, e foi o que borrou a fiada na sessão 13b. */
  const cor = (b) => `color-mix(in srgb, var(--d-${tok(b)}) 84%, var(--fundo))`;
  const paradas = [`${cor(blocos[0])} 0%`];
  let cum = 0, juntas = '';
  for (let j = 0; j < blocos.length - 1; j++) {
    cum += ws[j];
    /* Mistura curta. Com 45 % do troço, uma sessão de 25 blocos deixava 0,9 px de
       cor cheia no troço mais estreito (8,2 px numa barra de 350) e a fiada era um
       borrão. Com 18 % sobram 5,8 px no pior troço e 10,0 px em média. */
    const m = Math.min(0.9, 0.18 * Math.min(ws[j], ws[j + 1]));
    paradas.push(`${cor(blocos[j])} ${(cum - m).toFixed(2)}%`, `${cor(blocos[j + 1])} ${(cum + m).toFixed(2)}%`);
    if (tok(blocos[j]) === tok(blocos[j + 1])) juntas += `<i style="left:${cum.toFixed(2)}%"></i>`;
  }
  paradas.push(`${cor(blocos[blocos.length - 1])} 100%`);
  return `<span class="fiada${alta ? ' alta' : ''}" style="background:linear-gradient(90deg,${paradas.join(',')})">${juntas}</span>`;
}
function render() {
  const tema = temaDoEcra(S.screen), ecra = $('#ecra');
  ecra.className = 'ecra t-' + tema + ' m' + S.marca;
  let html = barraEstado();
  switch (S.screen) {
    case 'inicio': html += viewInicio(); break;
    case 'gravacao': html += viewGravacao(); break;
    case 'pos': html += viewPos(); break;
    case 'resumo': html += viewResumo(); break;
    case 'historico': html += viewHistorico(); break;
    case 'modelos': html += viewModelos(); break;
    case 'modelo': html += viewModelo(); break;
    case 'definicoes': html += viewDefinicoes(); break;
  }
  if (S.sheet) html += viewSheet();
  if (S.picker) html += viewPicker();
  ecra.innerHTML = html;
  if (document.body.classList.contains('solo')) document.body.style.background = tema === 'escuro' ? '#121010' : '#FBF8F4';
  renderGuia();
  bindLongPress();
}

/* ---------------------------- 1. Início ---------------------------- */
function viewInicio() {
  const chips = (grupo) => ORDEM.filter((k) => SPORTS[k].grupo === grupo)
    .map((k) => `<button class="tijolo d-${k}" data-act="start-sport" data-id="${k}">${ico(k, 'p')}${SPORTS[k].label}</button>`).join('');
  const modelo = (m) => `
    <div class="cartao tocavel d-${m.blocks[0].sport}" data-act="start-model" data-id="${m.id}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <h3 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.015em">${esc(m.name)}</h3>
        <span style="color:var(--acento-tinta);font-weight:800;font-size:14px">Iniciar</span>
      </div>
      <div style="font-size:13px;color:var(--tinta2);margin-top:2px">${m.hiit ? 'Só marcas · preenche-se no fim' : `${m.series} séries · ${m.blocks.map((b) => b.name).join(' · ')}`}</div>
      <div style="margin-top:12px">${m.hiit ? fiadaDe(Array.from({ length: 8 }, () => ({ sport: 'strength' }))) : fiadaDe(m.blocks)}</div>
    </div>`;
  return `
  <div class="cabeca">
    <div class="linha">
      <span class="kicker">Bricklap</span>
      <button class="redondo" data-act="ir" data-id="definicoes" title="Definições">${ico('definicoes', 'p')}</button>
    </div>
    <h1>Um toque e começa.</h1>
    <div class="sub">Marca fecha um bloco. Parar só no fim.</div>
  </div>
  <div class="rolar">
    <div class="secao" style="margin-top:16px"><div class="titulo"><h3>Modelos de treino</h3></div><div class="lista">${MODELS.map(modelo).join('')}</div></div>
    <div class="secao"><div class="titulo"><h3>Ginásio</h3></div><div class="grelha">${chips('ginasio')}</div></div>
    <div class="secao"><div class="titulo"><h3>Rua</h3></div><div class="grelha">${chips('rua')}</div></div>
  </div>
  ${viewTabs()}`;
}

/* ------------------------ 2 e 4. Gravação ------------------------ */
function viewGravacao() {
  const s = S.live, b = current(), hiit = !!(s.model && s.model.hiit), ficha = fichaDe(b);
  const fechados = s.blocks.slice(0, -1);
  const serie = s.model && !hiit ? `Série ${b.round + 1}${b.round + 1 > s.model.series ? ' extra' : ''} de ${s.model.series}` : (hiit ? `${b.round + 1}ª volta` : `Bloco ${s.blocks.length}`);
  const l = lastFor(b);
  const ultima = hiit ? '' :
    ficha === 'forca' && l.reps !== undefined ? `Última vez <b class="num">${l.reps} × ${fmtKg(l.kg)}</b>` :
    ficha === 'passadeira' && l.paceS ? `Última vez <b class="num">${fmtPace(l.paceS)} /km</b>` :
    ficha === 'metros' && l.meters ? `Última vez <b class="num">${fmtM(l.meters)}</b>` : '';
  const metricas = SPORTS[b.sport].gps ? `<div class="metricas">
      <div><small>Distância</small><b class="num" data-dist>${fmtKm(streetDist(b))}</b></div>
      <div><small>${b.sport === 'bike' ? 'Velocidade' : 'Ritmo'}</small><b class="num">${b.sport === 'bike' ? (SPORTS[b.sport].vel * 3.6).toFixed(0) + ' km/h' : fmtPace(1000 / SPORTS[b.sport].vel) + ' /km'}</b></div>
    </div>` : '';
  const ultimas = fechados.slice(-3).reverse().map((x) => {
    const v = valorDoBloco(x);
    return `<div class="l d-${x.sport}">${ico(x.sport, 'p')}<span class="n">${esc(x.name)}</span>${v.falta ? '<span class="v em-falta">por preencher</span>' : `<span class="v num">${v.html}</span>`}<span class="t num">${fmtTime(dur(x))}</span></div>`;
  }).join('');
  const proximo = s.model && !hiit ? nextBlockAfter(b).name : null;
  return `
  <div class="g-topo"><span class="modelo">${esc(s.name)}</span><span class="pilula">${serie}</span></div>
  <div class="chrono">
    <div class="t num" data-chrono="total">${fmtTime(S.clock)}</div>
    <div class="legenda">${ico('relogio', 'p')}<span>desde as ${s.startedAt} · <b class="num">${fechados.length}</b> ${fechados.length === 1 ? 'marca' : 'marcas'}</span></div>
    ${fiadaDe(fechados, true)}
  </div>
  <div class="bloco-atual d-${b.sport}">
    <div class="cima">${ico(b.sport, 'p')}<span class="kicker">${hiit ? 'Volta em curso' : SPORTS[b.sport].live}${s.model && !hiit ? ` · bloco ${b.modelIndex + 1} de ${s.model.blocks.length}` : ''}</span></div>
    <div class="linha"><span class="nome">${esc(b.name)}</span><span class="tempo num" data-chrono="bloco">${fmtTime(dur(b))}</span></div>
    ${ultima ? `<div class="ultima">${ultima}</div>` : ''}
    ${metricas}
  </div>
  ${ultimas ? `<div class="marcas">${ultimas}</div>` : ''}
  <div class="acoes">
    ${proximo ? `<div class="proximo"><span class="kicker">A seguir</span><span class="nome">${esc(proximo)}</span></div>` : ''}
    ${botaoMarca()}
    <div class="botoes">
      <button class="botao" data-act="picker">${ico('mudar')}Mudar</button>
      <button class="botao parar perigo" id="parar"><span class="enche"></span>${ico('parar')}Parar</button>
    </div>
  </div>`;
}
function viewPicker() {
  const chips = (grupo) => ORDEM.filter((k) => SPORTS[k].grupo === grupo)
    .map((k) => `<button class="tijolo d-${k}" data-act="change-sport" data-id="${k}">${ico(k, 'p')}${SPORTS[k].label}</button>`).join('');
  return `<div class="veu" data-act="close-picker"><div class="folha" data-stop>
    <div class="pega"></div>
    <div class="cabeca-f"><h2>Mudar para</h2></div>
    <div class="sub" style="margin-left:0">Fecha o bloco atual e abre um novo com outro desporto. O relógio não para.</div>
    <div class="secao"><div class="titulo"><h3>Ginásio</h3></div><div class="grelha">${chips('ginasio')}</div></div>
    <div class="secao"><div class="titulo"><h3>Rua</h3></div><div class="grelha">${chips('rua')}</div></div>
    <div class="botoes" style="grid-template-columns:1fr"><button class="botao fantasma" data-act="close-picker">Cancelar</button></div>
  </div></div>`;
}

/* ------------------------- 3. Ficha rápida ------------------------- */
function viewSheet() {
  const { session, index, draft, context, name } = S.sheet, b = session.blocks[index], f = fichaDe(b), d = fmtTime(dur(b));
  const serie = session.model && !session.model.hiit && session.model.blocks.length > 1 ? `Série ${b.round + 1} · ` : '';
  const sub = context === 'live' ? `${serie}<span class="num">${d}</span> · o relógio já conta o bloco seguinte` : `${serie}<span class="num">${d}</span>`;
  const passo = (campo, valor, unidade, menos, mais) => `<div class="passo">
      <button data-act="step" data-field="${campo}" data-delta="${menos}">${ico('menos')}</button>
      <div class="v num">${valor}${unidade ? `<small>${unidade}</small>` : ''}</div>
      <button data-act="step" data-field="${campo}" data-delta="${mais}">${ico('mais')}</button></div>`;
  let campos = '';
  if (f === 'forca') {
    const nomes = ['Supino', 'Agachamento', 'Elevações', 'Flexões', 'Remada', 'Prancha'];
    campos = `
      <div class="chips">${nomes.map((n) => `<button class="chip ${n === name ? 'ativo' : ''}" data-act="name" data-id="${n}">${n}</button>`).join('')}</div>
      <div class="campo"><label>Repetições</label>${passo('reps', draft.reps, '', -1, 1)}</div>
      <div class="campo"><label>Carga<small>barra ou halteres</small></label>${passo('kg', String(draft.kg).replace('.', ','), 'kg', -2.5, 2.5)}</div>`;
  } else if (f === 'passadeira') {
    const c = treadmillCalc({ ...b, fields: draft }) || { paceS: draft.paceS || 330, distM: 0 };
    campos = draft.entered === 'dist'
      ? `<div class="campo"><label>Distância<small>o que a máquina mostrava</small></label>${passo('distM', fmtKmCurto(draft.distM), '', -100, 100)}</div>
         <div class="campo calculado"><label>Ritmo<small>calculado: ${d} para ${fmtKmCurto(c.distM)}</small></label><span class="lido num">${fmtPace(c.paceS)} /km</span></div>
         <div class="chips"><button class="chip" data-act="step" data-field="paceS" data-delta="0">Indicar o ritmo</button></div>`
      : `<div class="campo"><label>Ritmo<small>o que a máquina mostrava</small></label>${passo('paceS', fmtPace(draft.paceS), '/km', 5, -5)}</div>
         <div class="campo calculado"><label>Distância<small>calculada: ${d} a ${fmtPace(c.paceS)}</small></label><span class="lido num">${fmtKm(c.distM)}</span></div>
         <div class="chips"><button class="chip" data-act="step" data-field="distM" data-delta="0">Indicar a distância</button></div>`;
  } else if (f === 'metros') {
    campos = `<div class="campo"><label>Metros<small>do monitor</small></label>${passo('meters', draft.meters, 'm', b.sport === 'pool' ? -25 : -50, b.sport === 'pool' ? 25 : 50)}</div>`;
  } else {
    campos = `<div class="nota">Neste desporto não há nada a preencher: a distância e o ritmo vêm do GPS.</div>`;
  }
  return `<div class="veu" data-act="close-sheet"><div class="folha d-${b.sport}" data-stop>
    <div class="pega"></div>
    <div class="cabeca-f">${ico(b.sport)}<h2>${esc(name)}</h2></div>
    <div class="sub">${sub}</div>
    <div style="margin-top:14px">${campos}</div>
    <div class="botoes"><button class="botao fantasma" data-act="close-sheet">${context === 'live' ? 'Depois' : 'Cancelar'}</button><button class="botao acento" data-act="save-sheet">${ico('certo')}Guardar</button></div>
    ${context === 'live' ? '<div class="nota">"Depois" deixa o bloco por preencher; completas no fim do treino.</div>' : ''}
  </div></div>`;
}

/* ------------------- Tabela de séries (expansível) ------------------- */
function linhaBloco(session, i, editavel) {
  const b = session.blocks[i], v = valorDoBloco(b);
  const valor = v.falta
    ? (editavel ? `<button class="preencher" data-act="preencher" data-id="${i}">Preencher</button>` : '<span class="valor em-falta" style="font-weight:600;font-size:13px;color:var(--acento-tinta)">por preencher</span>')
    : `<span class="valor num">${v.html}</span>`;
  return `<div class="linha-bloco d-${b.sport}"><span class="nome">${ico(b.sport, 'p')}${esc(b.name)}</span>${valor}<span class="t num">${fmtTime(dur(b))}</span></div>`;
}
function tabelaSeries(session, editavel) {
  const grupos = gruposDeSerie(session);
  if (!grupos) {
    return `<div class="serie aberta"><div class="serie-corpo">${session.blocks.map((_, i) => linhaBloco(session, i, editavel)).join('')}</div></div>`;
  }
  const idx = new Map(session.blocks.map((b, i) => [b, i]));
  return `<div class="series">${grupos.map((g, gi) => {
    const aberta = S.abertas.has(`${session.id}:${gi}`);
    const t = g.blocos.reduce((a, b) => a + dur(b), 0);
    const faltam = g.blocos.filter((b) => missing(b).length).length;
    return `<div class="serie ${aberta ? 'aberta' : ''}">
      <button class="serie-cab" data-act="serie" data-id="${gi}">
        <span class="n num">${gi + 1}</span>
        <span class="meio"><span class="rot">${g.rot}${faltam ? '' : ' · completa'}</span>${fiadaDe(g.blocos)}</span>
        ${faltam ? `<span class="selo num">${faltam}</span>` : '<span></span>'}
        <span class="t num">${fmtTime(t)}</span>
        <span class="seta">${ico('baixo', 'p')}</span>
      </button>
      ${aberta ? `<div class="serie-corpo">${g.blocos.map((b) => linhaBloco(session, idx.get(b), editavel)).join('')}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}
function legendaDesportos(session) {
  const usados = [...new Set(session.blocks.map((b) => b.sport))];
  return `<div class="legenda">${usados.map((k) => `<span class="d-${k}">${ico(k, 'p')}${SPORTS[k].label}</span>`).join('')}
    ${blocosEmFalta(session).length ? '<span style="color:var(--acento-tinta);font-weight:700">nº = blocos por preencher</span>' : ''}</div>`;
}

function ladoDeDistancias(s) {
  const feitos = s.blocks.filter((b) => !missing(b).length);
  const passadeira = feitos.filter((b) => fichaDe(b) === 'passadeira').reduce((a, b) => a + treadmillCalc(b).distM, 0);
  const metros = feitos.filter((b) => fichaDe(b) === 'metros').reduce((a, b) => a + b.fields.meters, 0);
  const rua = s.blocks.filter((b) => SPORTS[b.sport].gps).reduce((a, b) => a + streetDist(b), 0);
  const linhas = [
    passadeira ? `<span><b class="num">${fmtKmCurto(passadeira)}</b>passadeira</span>` : '',
    metros ? `<span><b class="num">${fmtM(metros)}</b>remo</span>` : '',
    rua ? `<span><b class="num">${fmtKm(rua)}</b>na rua</span>` : '',
  ].filter(Boolean).join('');
  return linhas ? `<span class="lado">${linhas}</span>` : '';
}
function avisoFalta(s) {
  const faltam = blocosEmFalta(s);
  if (!faltam.length) return '';
  return `<div class="aviso">${ico('aviso', 'p')}<span class="kick">Por preencher</span>` +
    `<b>${faltam.length} ${faltam.length === 1 ? 'bloco' : 'blocos'}</b>` +
    `<span class="det">${frasesEmFalta(s).join(' · ')}</span>` +
    `<button class="botao acento" data-act="preencher-proximo">Preencher</button></div>`;
}

/* ------------------------- 5. Pós-treino ------------------------- */
function viewPos() {
  const s = S.post;
  return `
  <div class="cabeca"><div class="linha"><span class="kicker">Treino terminado</span><span class="pilula">${s.startedAt} – ${s.terminouAs || horaAtual()}</span></div></div>
  <div class="rolar">
    <h1>${esc(s.name)}</h1>
    <div class="sub">${s.blocks.length} blocos${gruposDeSerie(s) ? ` em ${gruposDeSerie(s).length} séries` : ''}</div>
    <div class="heroi"><span class="total num">${fmtTime(s.stoppedAt)}</span>${ladoDeDistancias(s)}</div>
    ${avisoFalta(s)}
    <div class="secao"><div class="titulo"><h3>${gruposDeSerie(s) ? 'Por série' : 'Blocos'}</h3><span>toca num valor para corrigir</span></div>${tabelaSeries(s, true)}${legendaDesportos(s)}</div>
    <div class="secao"><div class="titulo"><h3>Notas</h3></div><textarea class="notas" data-act="notes" placeholder="Como correu, o que mudar…">${esc(s.notes || '')}</textarea></div>
    <div style="margin-top:20px"><button class="botao acento largo" data-act="finish">${ico('certo')}Concluir</button></div>
    <div class="nota" style="text-align:center">Fica guardado como está. Podes preencher depois, no histórico.</div>
  </div>`;
}

/* ---------------------- 6. Resumo por blocos ---------------------- */
function viewResumo() {
  const s = S.view, grupos = agrupaPorExercicio(s);
  return `
  <div class="cabeca"><div class="linha"><button class="voltar" data-act="back">${ico('voltar', 'p')}Histórico</button><span class="pilula">${s.when} · ${s.startedAt}${s.terminouAs ? ' – ' + s.terminouAs : ''}</span></div></div>
  <div class="rolar">
    <h1>${esc(s.name)}</h1>
    <div class="sub">${s.blocks.length} blocos${gruposDeSerie(s) ? ` em ${gruposDeSerie(s).length} séries` : ''} · ${[...new Set(s.blocks.map((b) => SPORTS[b.sport].label.toLowerCase()))].join(', ')}</div>
    <div class="heroi"><span class="total num">${fmtTime(s.stoppedAt)}</span>${ladoDeDistancias(s)}</div>
    ${avisoFalta(s)}
    <div class="secao"><div class="titulo"><h3>Por exercício</h3><span>${grupos.length} ${grupos.length === 1 ? 'exercício' : 'exercícios'}</span></div>
      <div class="lista">${grupos.map((g) => {
        const r = resumoExercicio(g);
        return `<div class="ex d-${g.sport}">
          <span class="nome">${ico(g.sport, 'p')}${esc(g.name)}</span>
          <span class="n num">${r.n}</span>
          <span class="det${r.falta ? ' em-falta' : ''}">${r.falta ? `${r.falta} de ${r.total} por preencher` : `${r.total} ${r.total === 1 ? 'bloco' : 'blocos'}`}</span>
          <span class="sub-n num">${r.det}</span>
        </div>`;
      }).join('')}</div></div>
    ${s.notes ? `<div class="secao"><div class="titulo"><h3>Notas</h3>${ico('editar', 'p')}</div><div class="notas">${esc(s.notes)}</div></div>` : ''}
    <div class="secao"><div class="titulo"><h3>${gruposDeSerie(s) ? 'Por série' : 'Blocos'}</h3><span>${s.blocks.length} blocos</span></div>${tabelaSeries(s, true)}${legendaDesportos(s)}</div>
  </div>`;
}

/* ------------------------- 7. Histórico ------------------------- */
function viewHistorico() {
  const lista = S.sessions.map((s) => {
    const conf = S.confirmDelete === s.id, teste = s.stoppedAt < 60000, faltam = blocosEmFalta(s).length;
    const d = distanciaTotal(s);
    const meta = [s.model && s.model.hiit ? `${s.blocks.length} voltas` : gruposDeSerie(s) ? `${gruposDeSerie(s).length} séries · ${s.blocks.length} blocos` : null, d ? fmtKm(d) : null, teste ? 'sessão de teste' : null].filter(Boolean).join(' · ');
    return `<div class="sessao">
      <div class="cima" data-act="open-session" data-id="${s.id}">
        <div><div class="quando">${s.when} · ${s.startedAt}</div><h3>${esc(s.name)}</h3><div class="meta">${meta || '—'}</div></div>
        <span class="dur num">${fmtTime(s.stoppedAt)}</span>
      </div>
      ${fiadaDe(s.blocks)}
      ${conf ? `<div class="confirmar"><span>Apagar? Não há volta.</span><div style="display:flex;gap:8px"><button class="botao pequeno" data-act="cancel-delete">Manter</button><button class="botao pequeno acento" data-act="delete" data-id="${s.id}">${ico('apagar', 'p')}Apagar</button></div></div>`
             : `<div class="rodape">${faltam ? `<span class="selo-falta">${faltam} por preencher</span>` : '<span></span>'}<button class="botao fantasma pequeno perigo" data-act="ask-delete" data-id="${s.id}">${ico('apagar', 'p')}Apagar</button></div>`}
    </div>`;
  }).join('');
  return `
  <div class="cabeca"><div class="linha"><span class="kicker">Bricklap</span><button class="redondo" data-act="ir" data-id="definicoes">${ico('definicoes', 'p')}</button></div><h1>Histórico</h1><div class="sub">${S.sessions.length} ${S.sessions.length === 1 ? 'sessão' : 'sessões'}</div></div>
  <div class="rolar"><div class="lista" style="margin-top:16px">${lista || '<div class="vazio">Sem sessões.</div>'}</div></div>
  ${viewTabs()}`;
}

/* ------------------------- 8. Modelos ------------------------- */
function viewModelos() {
  return `
  <div class="cabeca"><div class="linha"><span class="kicker">Bricklap</span><button class="redondo" data-act="ir" data-id="definicoes">${ico('definicoes', 'p')}</button></div><h1>Modelos</h1><div class="sub">Uma lista de blocos com nomes. Ao iniciar, as marcas já vêm preenchidas.</div></div>

      <div style="font-size:13px;color:var(--tinta2);margin-top:2px">${m.hiit ? 'Só marcas · preenche-se no fim' : `${m.series} séries · ${m.blocks.length} blocos`}</div>
      <div style="margin-top:12px">${fiadaDe(m.blocks)}</div>

    </div>`).join('')}
    <button class="botao largo" data-act="new-model">${ico('mais')}Novo modelo</button>
  </div></div>
  ${viewTabs()}`;
}
function viewModelo() {
  const m = S.editModel;
  return `
  <div class="cabeca"><div class="linha"><button class="voltar" data-act="back-models">${ico('voltar', 'p')}Modelos</button><button class="botao acento pequeno" data-act="save-model">${ico('certo', 'p')}Guardar</button></div></div>
  <div class="rolar">
    <div class="linha-campo" style="border-top:0"><label>Nome</label><input type="text" value="${esc(m.name)}" data-act="model-name"></div>
    <div class="linha-campo"><label>Séries<small>quantas vezes a lista se repete</small></label>
      <div class="passo"><button data-act="model-series" data-delta="-1">${ico('menos')}</button><div class="v num">${m.series}</div><button data-act="model-series" data-delta="1">${ico('mais')}</button></div></div>
    <div class="linha-campo"><label>Modo<small>HIIT: só marcas, preenche no fim</small></label>
      <div class="alternar"><button class="${m.hiit ? '' : 'ativo'}" data-act="model-hiit" data-id="0">Fichas</button><button class="${m.hiit ? 'ativo' : ''}" data-act="model-hiit" data-id="1">HIIT</button></div></div>
    <div class="secao"><div class="titulo"><h3>Blocos, por ordem</h3><span>${m.blocks.length}</span></div>
      <div class="lista">${m.blocks.map((b, i) => `<div class="mb d-${b.sport}">
        <div><div class="nome">${ico(b.sport, 'p')}${esc(b.name)}</div><div class="desp">${SPORTS[b.sport].label}</div></div>
        <div class="setas">
          <button data-act="mb-up" data-id="${i}" ${i === 0 ? 'disabled' : ''}>${ico('cima', 'p')}</button>
          <button data-act="mb-down" data-id="${i}" ${i === m.blocks.length - 1 ? 'disabled' : ''}>${ico('baixo', 'p')}</button>
          <button data-act="mb-del" data-id="${i}">${ico('x', 'p')}</button></div>
      </div>`).join('') || '<div class="vazio">Sem blocos. Adiciona abaixo.</div>'}</div></div>
    <div class="secao"><div class="titulo"><h3>Adicionar bloco</h3></div>
      <div class="grelha">${ORDEM.map((k) => `<button class="tijolo d-${k}" data-act="mb-add" data-id="${k}" style="min-height:48px">${ico(k, 'p')}${SPORTS[k].label}</button>`).join('')}</div>
      <div class="nota">Em força pede-se o nome do exercício; nos outros o nome é o do desporto.</div></div>
  </div>`;
}

/* ------------------------- 9. Definições ------------------------- */

  { id: 'sistema', nome: 'Seguir o sistema', exp: 'Acompanha o tema do telemóvel.', amostra: ['clara', 'escura'] },
];
function viewDefinicoes() {
